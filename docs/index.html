<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Identity photo capture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prototype browser SDK for 480×640 identity photos with live background removal, PAD-bound capture, and decoded-JPEG audit.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/site.css?v=2">
  <script>
    // Apply stored theme before paint; full control mounts in assets/theme.js.
    (function () {
      var key = 'camera-docs-theme';
      var saved = localStorage.getItem(key);
      var pref = (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.themePreference = pref;
    })();
  </script>
</head>
<body>
  <div id="app">Loading docs…</div>
  <script>
    window.$docsify = {
      name: 'Identity photo capture',
      nameLink: '#/',
      repo: 'https://github.com/alijamal14/camera',
      homepage: 'home.md',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      autoHeader: false,
      auto2top: true,
      maxLevel: 4,
      search: {
        paths: 'auto',
        placeholder: 'Search docs',
        noData: 'No results',
        depth: 4,
      },
      // Relative aliases: a leading "/_sidebar.md" would hit the domain root on
      // https://ali.mk313.com/camera/ instead of this project.
      alias: {
        '/.*/_sidebar.md': '_sidebar.md',
        '/.*/_navbar.md': '_navbar.md',
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied',
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            document.documentElement.dataset.page = location.hash.replace(/^#\/?/, '').split('?')[0] || 'home';
          });
        },
      ],
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="assets/theme.js?v=2" data-cfasync="false"></script>
</body>
</html>
